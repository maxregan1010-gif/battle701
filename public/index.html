<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Battle|701</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b10;color:#fff;font-family:Tahoma,Arial,sans-serif;touch-action:none}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center,#253448,#07090d 70%);z-index:50}
.panel{width:min(430px,92vw);padding:28px;border:1px solid #50657b;border-radius:24px;background:rgba(10,15,23,.88);box-shadow:0 20px 80px #0008;text-align:center}
h1{margin:0 0 8px;font-size:30px}.sub{color:#aebdca;margin-bottom:22px}
input,button{width:100%;height:50px;border:0;border-radius:14px;font:inherit}input{padding:0 15px;margin:7px 0;background:#eef3f7;color:#101820}
button{margin-top:9px;background:#2e9bff;color:#fff;font-weight:bold;cursor:pointer;box-shadow:0 6px 18px #0005}button:active{transform:scale(.98)}button.secondary{background:#263342}.hidden{display:none!important}
#roomUI{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:linear-gradient(#101923,#080b10)}
#roomBox{width:min(600px,94vw);background:#111a24dd;border:1px solid #42586d;border-radius:22px;padding:22px}
#roomCode{font-size:34px;letter-spacing:7px;color:#59c7ff;font-weight:bold;margin:8px}
#members{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:15px 0;max-height:270px;overflow:auto}
.member{padding:10px;border-radius:10px;background:#202d3a}.host{outline:2px solid #ffc44d}
#renderCanvas{width:100%;height:100%;display:block;outline:none}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;display:none}
#top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;direction:ltr}
.badge{background:#071018cc;border:1px solid #496071;border-radius:12px;padding:8px 12px;direction:rtl}
#cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);border:1px solid #fff;border-radius:50%}
#cross:after{content:"";position:absolute;width:4px;height:4px;background:#fff;border-radius:50%;left:6px;top:6px}
#gun{position:absolute;left:50%;bottom:4%;width:170px;height:95px;transform:translateX(-50%);background:linear-gradient(145deg,#343a42,#11161b);clip-path:polygon(15% 35%,100% 25%,100% 55%,70% 62%,58% 100%,35% 100%,38% 60%,15% 55%);filter:drop-shadow(0 8px 10px #000);opacity:.95}
#flash{position:absolute;left:50%;top:47%;width:7px;height:80px;background:#ff3030;transform:translate(-50%,-50%);opacity:0;filter:blur(.4px)}
#stats{position:absolute;bottom:14px;left:14px;direction:rtl}
#hpbar{width:210px;height:18px;background:#241116;border-radius:10px;overflow:hidden;border:1px solid #71333d}
#hp{height:100%;width:100%;background:#37d477}
#killText{margin-top:5px}
#timer{font-size:20px;font-weight:bold}
#roomText{font-size:14px}
#dead,#winner{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:#0009;text-align:center}
.big{font-size:42px;font-weight:bold}.small{color:#ccd6de;margin-top:10px}
#winner .big{color:#ffd34f}
#mobile{position:fixed;inset:0;z-index:15;display:none;pointer-events:none}
#stick{position:absolute;left:25px;bottom:30px;width:130px;height:130px;border-radius:50%;background:#ffffff18;border:2px solid #ffffff35;pointer-events:auto}
#knob{position:absolute;width:58px;height:58px;border-radius:50%;background:#ffffff55;left:34px;top:34px}
#look{position:absolute;right:0;top:0;width:55%;height:72%;pointer-events:auto}
#fire{position:absolute;right:25px;bottom:42px;width:88px;height:88px;border-radius:50%;background:#e3313b99;border:2px solid #fff6;pointer-events:auto}
#mobileHint{position:absolute;right:25px;bottom:140px;color:#fff8;font-size:12px}
@media (pointer:coarse){#mobile{display:block}}
@media (max-width:600px){.panel{padding:20px}h1{font-size:25px}#gun{width:135px;height:78px}}
</style>
</head>
<body>
<div id="menu">
  <div class="panel">
    <h1>Battle701</h1>
    <div class="sub">بتل‌رویال بر و بچ 701 آنلاین</div>
    <input id="name" maxlength="20" placeholder="اسمت را برای دختر نیمار وارد کن">
    <button id="create">ساخت اتاق بازی</button>
    <button id="joinBtn" class="secondary">ورود به اتاق دیگران برای بازی</button>
    <div id="joinArea" class="hidden">
      <input id="roomCodeInput" maxlength="5" placeholder="کد اتاقش">
      <button id="join">ورود به اتاقش</button>
    </div>
    <div id="msg"></div>
  </div>
</div>

<div id="roomUI" class="hidden">
 <div id="roomBox">
   <div>کد اتاق</div>
   <div id="roomCode">-----</div>
   <div id="roomInfo">این کد را برای دوستان و اشنایان و نزدیکانت بفرست</div>
   <div id="members"></div>
   <button id="start" class="hidden">شروع بازی</button>
   <button id="leave" class="secondary">خروج از اتاق</button>
 </div>
</div>

<canvas id="renderCanvas"></canvas>
<div id="hud">
 <div id="top">
   <div class="badge"><span id="roomText"></span></div>
   <div class="badge">⏱ <span id="timer">10:00</span></div>
 </div>
 <div id="cross"></div><div id="gun"></div><div id="flash"></div>
 <div id="stats">
   <div id="hpbar"><div id="hp"></div></div>
   <div id="killText">❤️ 100 | 🔫 کیل: 0</div>
 </div>
</div>
<div id="mobile">
 <div id="stick"><div id="knob"></div></div>
 <div id="look"></div><button id="fire">🔫</button>
 <div id="mobileHint">چپ: حرکت · راست: نگاه</div>
</div>
<div id="dead"><div><div class="big">💀 کشته شدی</div><div class="small">در حال بازگشت به نقشه...</div></div></div>
<div id="winner"><div><div class="big" id="winnerText"></div><div class="small">بازی دوباره آماده می‌شود...</div></div></div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
const socket=io();
const $=id=>document.getElementById(id);
let roomCode="", myId="", isHost=false, started=false, roomData=null;
let engine,scene,camera,gunRoot,me,players={},bots={},obstacles=[];
let lastSend=0,lastFire=0,keys={},joy={x:0,y:0},lookTouch=null;
const WORLD=190;

$("joinBtn").onclick=()=> $("joinArea").classList.toggle("hidden");
$("create").onclick=()=>{
 const n=$("name").value.trim(); if(!n) return $("msg").textContent="اول اسمت را وارد کن.";
 socket.emit("createRoom",{name:n});
};
$("join").onclick=()=>{
 const n=$("name").value.trim(), c=$("roomCodeInput").value.trim().toUpperCase();
 if(!n||c.length!==5) return $("msg").textContent="نام و کد اتاق را کامل وارد کن.";
 socket.emit("joinRoom",{name:n,roomCode:c});
};
$("start").onclick=()=>socket.emit("startGame");
$("leave").onclick=()=>socket.disconnect();

socket.on("connect",()=>{myId=socket.id});
socket.on("joined",d=>{
 roomCode=d.code; isHost=d.host;
 $("menu").classList.add("hidden"); $("roomUI").classList.remove("hidden"); $("roomCode").textContent=roomCode;
});
socket.on("errorMessage",m=>alert(m));
socket.on("roomState",state=>{
 roomData=state; roomCode=state.code; isHost=state.hostId===myId;
 $("roomCode").textContent=state.code;
 $("start").classList.toggle("hidden",!isHost||state.started);
 $("roomInfo").textContent=state.started?"بازی در حال اجراست":"کد را برای دوستانت بفرست";
 $("timer").textContent=fmt(state.timeLeft);
 const arr=state.players;
 $("members").innerHTML=arr.map(p=>`<div class="member ${p.id===state.hostId?'host':''}">${p.name}${p.id===state.hostId?' 👑':''}</div>`).join("");
 if(started) syncWorld(state);
});
socket.on("gameStarted",state=>{
 started=true; $("roomUI").classList.add("hidden"); $("hud").style.display="block";
 $("roomText").textContent="اتاق: "+state.code;
 initGame().then(()=>syncWorld(state));
});
socket.on("hitConfirmed",d=>{ if(d.shooterId===myId) muzzle(); });
socket.on("youDied",d=>{
 $("dead").style.display="flex";
 setTimeout(()=>{$("dead").style.display="none"},1500);
});
socket.on("gameOver",d=>{
 started=false; $("hud").style.display="none"; $("mobile").style.display="none";
 $("winner").style.display="flex";
 $("winnerText").textContent=d.winner?`🏆 برنده: ${d.winner.name} — ${d.winner.kills} کیل`:"بازی تمام شد";
 setTimeout(()=>{$("winner").style.display="none"; $("roomUI").classList.remove("hidden")},5000);
});

function fmt(s){s=Math.max(0,s|0);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}

async function initGame(){
 if(engine) return;
 const canvas=$("renderCanvas");
 engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:false,stencil:true},true);
 scene=new BABYLON.Scene(engine);
 scene.clearColor=new BABYLON.Color4(.025,.04,.055,1);
 const hemi=new BABYLON.HemisphericLight("hemi",new BABYLON.Vector3(0,1,0),scene); hemi.intensity=.75;
 const sun=new BABYLON.DirectionalLight("sun",new BABYLON.Vector3(-.4,-1,-.3),scene);sun.intensity=.65;
 camera=new BABYLON.UniversalCamera("fps",new BABYLON.Vector3(0,2,0),scene);
 camera.minZ=.05;camera.fov=.95;camera.speed=.0;camera.angularSensibility=2600;
 camera.attachControl(canvas,true);
 camera.inputs.removeByType("FreeCameraKeyboardMoveInput");
 gunRoot=new BABYLON.TransformNode("gunRoot",scene);
 const body=BABYLON.MeshBuilder.CreateBox("gun",{width:.18,height:.18,depth:1.15},scene); body.parent=gunRoot;body.position.z=.65;body.position.y=-.15;
 const mat=new BABYLON.StandardMaterial("gunMat",scene);mat.diffuseColor=new BABYLON.Color3(.08,.09,.1);body.material=mat;
 gunRoot.parent=camera;gunRoot.position=new BABYLON.Vector3(.38,-.32,.65);

 buildWorld();
 window.addEventListener("keydown",e=>keys[e.code]=true);
 window.addEventListener("keyup",e=>keys[e.code]=false);
 canvas.addEventListener("mousedown",()=>{canvas.requestPointerLock?.()});
 canvas.addEventListener("click",()=>fire());
 canvas.addEventListener("touchstart",e=>{if(e.touches.length===1) lookTouch={x:e.touches[0].clientX,y:e.touches[0].clientY}}, {passive:false});
 canvas.addEventListener("touchmove",e=>{
   if(e.touches.length===1&&lookTouch){
     const t=e.touches[0],dx=t.clientX-lookTouch.x,dy=t.clientY-lookTouch.y;
     camera.rotation.y+=dx*.006;camera.rotation.x=clamp(camera.rotation.x+dy*.004,-1.35,1.35);
     lookTouch={x:t.clientX,y:t.clientY};e.preventDefault();
   }
 },{passive:false});
 setupMobile();
 engine.runRenderLoop(()=>{updateLocal();scene.render()});
 window.addEventListener("resize",()=>engine.resize());
}

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function mat(name,color){
 const m=new BABYLON.StandardMaterial(name,scene);m.diffuseColor=BABYLON.Color3.FromHexString(color);return m;
}
function box(name,x,y,z,w,h,d,color){
 const m=BABYLON.MeshBuilder.CreateBox(name,{width:w,height:h,depth:d},scene);m.position.set(x,y,z);m.material=mat(name+"m",color);obstacles.push(m);return m;
}
function buildWorld(){
 const ground=BABYLON.MeshBuilder.CreateGround("ground",{width:WORLD,height:WORLD},scene);ground.material=mat("ground","#66735b");
 const road=box("road",0,.02,0,35,.05,190,"#30383b");
 const road2=box("road2",0,.025,0,190,.05,35,"#30383b");
 for(let x=-80;x<=80;x+=40) for(let z=-80;z<=80;z+=40){
   if(Math.abs(x)<45&&Math.abs(z)<45) continue;
   box("house",x,4,z,18,8,15,"#a18d70");
   box("roof",x,8.5,z,19,1,16,"#624f43");
   box("door",x,2.1,z-7.6,3.2,4.2,.2,"#3a2a23");
 }
 for(let i=0;i<80;i++){
   const x=(Math.random()*180)-90,z=(Math.random()*180)-90;
   if(Math.abs(x)<42||Math.abs(z)<42) continue;
   const trunk=BABYLON.MeshBuilder.CreateCylinder("trunk",{height:5,diameter:.9},scene);trunk.position.set(x,2.5,z);trunk.material=mat("tr","#60452d");obstacles.push(trunk);
   const crown=BABYLON.MeshBuilder.CreateSphere("crown",{diameter:5,segments:8},scene);crown.position.set(x,6,z);crown.material=mat("leaf","#2d6339");obstacles.push(crown);
 }
 const border=mat("border","#202830");
 box("b1",0,2,-99,198,4,2,"#202830");box("b2",0,2,99,198,4,2,"#202830");
 box("b3",-99,2,0,2,4,198,"#202830");box("b4",99,2,0,2,4,198,"#202830");
}

function makePlayer(p){
 if(players[p.id]) return;
 const root=new BABYLON.TransformNode(p.id,scene);
 const body=BABYLON.MeshBuilder.CreateCapsule("playerBody",{height:2.4,radius:.48},scene);body.parent=root;body.position.y=1.2;
 body.material=mat(p.id+"mat",p.id===myId?"#3498ff":"#e54b4b");
 const label=makeLabel(p.name);
 label.parent=root;label.position.y=3.2;
 players[p.id]=root;
}
function makeBot(b){
 if(bots[b.id]) return;
 const root=new BABYLON.TransformNode(b.id,scene);
 const body=BABYLON.MeshBuilder.CreateCapsule("zbody",{height:2.4,radius:.48},scene);body.parent=root;body.position.y=1.2;body.material=mat(b.id+"m","#7bbf5b");
 for(const side of [-1,1]){
   const arm=BABYLON.MeshBuilder.CreateBox("arm",{width:.25,height:1.4,depth:.25},scene);arm.parent=root;arm.position.set(side*.68,1.35,.18);arm.rotation.z=side*.18;arm.material=body.material;
   const leg=BABYLON.MeshBuilder.CreateBox("leg",{width:.3,height:1.1,depth:.35},scene);leg.parent=root;leg.position.set(side*.25,.55,0);leg.material=body.material;
 }
 const label=makeLabel(b.name);label.parent=root;label.position.y=3.1;
 bots[b.id]=root;
}
function makeLabel(text){
 const plane=BABYLON.MeshBuilder.CreatePlane("name",{width:3.2,height:.55},scene);
 const tex=new BABYLON.DynamicTexture("txt",{width:512,height:90},scene,true);tex.hasAlpha=true;
 const c=tex.getContext();c.clearRect(0,0,512,90);c.fillStyle="white";c.font="bold 44px Tahoma";c.textAlign="center";c.fillText(text,256,58);tex.update();
 const m=new BABYLON.StandardMaterial("labelmat",scene);m.diffuseTexture=tex;m.opacityTexture=tex;m.emissiveColor=new BABYLON.Color3(1,1,1);plane.material=m;
 plane.billboardMode=BABYLON.Mesh.BILLBOARDMODE_ALL;return plane;
}
function syncWorld(state){
 state.players.forEach(p=>{
   makePlayer(p);
   if(p.id!==myId) players[p.id].position.set(p.x,p.y-2,p.z),players[p.id].rotation.y=p.rot;
   else {me=p; if(camera) {camera.position.x=p.x;camera.position.z=p.z;}}
 });
 state.bots.forEach(b=>{makeBot(b);bots[b.id].position.set(b.x,b.y-2,b.z);bots[b.id].rotation.y=b.rot;});
 Object.keys(players).forEach(id=>{if(!state.players.some(p=>p.id===id)){players[id].dispose();delete players[id]}});
 Object.keys(bots).forEach(id=>{if(!state.bots.some(b=>b.id===id)){bots[id].dispose();delete bots[id]}});
 if(me){$("hp").style.width=me.hp+"%";$("killText").textContent=`❤️ ${me.hp} | 🔫 کیل: ${me.kills}`;}
 $("timer").textContent=fmt(state.timeLeft);
}
function updateLocal(){
 if(!started||!camera) return;
 let f=0,r=0;
 if(keys.KeyW||keys.ArrowUp)f+=1;if(keys.KeyS||keys.ArrowDown)f-=1;
 if(keys.KeyD||keys.ArrowRight)r+=1;if(keys.KeyA||keys.ArrowLeft)r-=1;
 f+=-joy.y;r+=joy.x;
 const len=Math.hypot(f,r)||1;if(len>1){f/=len;r/=len}
 const sp=.16;
 const yaw=camera.rotation.y;
 camera.position.x+= (Math.sin(yaw)*f+Math.cos(yaw)*r)*sp;
 camera.position.z+= (Math.cos(yaw)*f-Math.sin(yaw)*r)*sp;
 camera.position.x=clamp(camera.position.x,-94,94);camera.position.z=clamp(camera.position.z,-94,94);
 if(Date.now()-lastSend>70){socket.emit("move",{x:camera.position.x,y:2,z:camera.position.z,rot:camera.rotation.y});lastSend=Date.now()}
}
function fire(){
 if(!started||Date.now()-lastFire<180)return;lastFire=Date.now();muzzle();
 const ray=scene.createPickingRay(scene.getEngine().getRenderWidth()/2,scene.getEngine().getRenderHeight()/2,BABYLON.Matrix.Identity(),camera);
 const hit=scene.pickWithRay(ray,m=>m.isPickable!==false);
 let end=ray.origin.add(ray.direction.scale(100));
 let targetId=null;
 if(hit&&hit.hit){end=hit.pickedPoint;
   let node=hit.pickedMesh;
   while(node&&node.parent&&!(players[node.name]||bots[node.name]))node=node.parent;
   const id=node?.name;
   if(id&&id!==myId&&(players[id]||bots[id]))targetId=id;
 }
 drawTracer(ray.origin,end);
 if(targetId)socket.emit("shoot",{targetId});
}
function muzzle(){
 $("flash").style.opacity="1";setTimeout(()=>$("flash").style.opacity="0",45);
}
function drawTracer(a,b){
 const line=BABYLON.MeshBuilder.CreateLines("tracer",{points:[a,b]},scene);line.color=new BABYLON.Color3(1,0.05,.05);line.alpha=.9;
 setTimeout(()=>line.dispose(),90);
}
function setupMobile(){
 const stick=$("stick"),knob=$("knob");
 stick.addEventListener("touchmove",e=>{
   const t=e.touches[0],r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
   let x=t.clientX-cx,y=t.clientY-cy,d=Math.hypot(x,y),max=52;if(d>max){x=x/d*max;y=y/d*max}
   knob.style.transform=`translate(${x}px,${y}px)`;joy={x:x/max,y:y/max};e.preventDefault();
 },{passive:false});
 stick.addEventListener("touchend",()=>{joy={x:0,y:0};knob.style.transform=""});
 $("fire").addEventListener("touchstart",e=>{fire();e.preventDefault()},{passive:false});
}
</script>
</body>
</html>
