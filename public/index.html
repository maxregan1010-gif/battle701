ition:absolute;left:20px;bottom:22px;width:145px;height:145px;border-radius:50%;background:#071a2c99;border:2px solid #ffffff20;pointer-events:auto;touch-action:none}.knob{position:absolute;left:50%;top:50%;width:62px;height:62px;transform:translate(-50%,-50%);border-radius:50%;background:#61d8ff55;border:1px solid #ffffff35}.mBtn{position:absolute;width:76px;height:50px;padding:0;color:#fff;background:#071a2de8;border:1px solid #ffffff25;box-shadow:none;pointer-events:auto;touch-action:none}.fire{right:22px;bottom:25px;width:94px;height:94px;border-radius:50%;background:#bb3349e8;font-size:16px}.reload{right:128px;bottom:108px}.run{left:180px;bottom:34px}.full{right:18px;top:18px;width:50px;height:44px;padding:0}.look{position:absolute;right:0;top:0;width:58%;height:100%;pointer-events:auto;touch-action:none}.dead,.winner{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;text-align:center;background:#0009}.dead.show,.winner.show{display:flex}.big{font-size:45px;font-weight:1000}.winner .big{color:#ffd45b}.small{color:#ccd7e0;margin-top:10px}

<div id="menu"><div class="panel"><h1 class="title">battle701</h1><div class="field"><input id="name" maxlength="18" placeholder="اسمتو برای دختر نیمار بتایپ"></div><div class="grid"><button id="create">ساخت اتاق بازی</button><button id="showJoin" class="secondary">ورود به اتاق دیگران برای بازی</button></div><div id="joinArea" class="joinArea hidden"><div class="field"><label>کد اتاقش</label><input id="roomCodeInput" maxlength="5" placeholder="ABCDE" style="letter-spacing:.3em;text-transform:uppercase"></div><button id="join" class="wide">ورود به اتاقش</button></div><p id="msg" class="hint"></p></div></div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const socket=io();
const canvas=$('renderCanvas');
const engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:false,stencil:true,antialias:true});
const scene=new BABYLON.Scene(engine);scene.clearColor=new BABYLON.Color4(.42,.68,.84,1);scene.collisionsEnabled=true;scene.gravity=new BABYLON.Vector3(0,-.32,0);
let camera,gun,started=false,myId='',room=null,playerName='---',lastMove=0,lastShot=0,toastTimer=0,lookId=null,joyId=null;const keys={};const remote=new Map(),bots=new Map();let joyX=0,joyY=0,sprinting=false;
const HOUSES=[];for(let x=-80;x<=80;x+=40)for(let z=-80;z<=80;z+=40){if(Math.abs(x)<45&&Math.abs(z)<45)continue;HOUSES.push({x,z,w:18,d:15});}
const TREES=[[-88,-86,1],[-64,-88,.9],[-40,-88,1.15],[40,-88,1],[64,-86,.9],[88,-88,1.05],[-88,-64,.85],[-70,-60,1],[70,-62,.9],[88,-60,1.05],[-90,-25,1],[-72,-18,.9],[72,-18,1],[90,-25,.9],[-90,25,.95],[-72,18,1],[72,18,.9],[90,28,1.05],[-88,60,1.05],[-70,64,.9],[70,62,1],[88,64,.9],[-88,88,1],[-64,86,.9],[-40,88,1.05],[40,88,1],[64,88,.9],[88,86,1.05],[-30,-86,.8],[30,-86,.85],[-30,86,.85],[30,86,.8]];
function mat(n,c,em){const m=new BABYLON.StandardMaterial(n,scene);m.diffuseColor=BABYLON.Color3.FromHexString(c);if(em)m.emissiveColor=BABYLON.Color3.FromHexString(em);m.specularColor=new BABYLON.Color3(.12,.12,.12);return m}
const M={ground:mat('ground','#5d7957'),road:mat('road','#30383b'),house:mat('house','#b28d67'),roof:mat('roof','#70463c'),door:mat('door','#3c2921'),window:mat('window','#5fc7e8','#173f4d'),trunk:mat('trunk','#65452b'),leaf:mat('leaf','#2d6c38'),leaf2:mat('leaf2','#4d8b3c'),player:mat('player','#258cff','#062b52'),other:mat('other','#e34f58','#4b0a10'),bot:mat('bot','#79b94f','#173a0b'),skin:mat('skin','#e8a06f'),gun:mat('gun','#252b32','#080b0e'),black:mat('black','#111418'),label:mat('label','#ffffff','#ffffff')};
function box(n,x,y,z,w,h,d,m,coll=true){const q=BABYLON.MeshBuilder.CreateBox(n,{width:w,height:h,depth:d},scene);q.position.set(x,y,z);q.material=m;q.checkCollisions=coll;q.isPickable=coll;return q}
function tree(x,z,s=1){const t=BABYLON.MeshBuilder.CreateCylinder('trunk',{height:5*s,diameter:.9*s,tessellation:12},scene);t.position.set(x,2.5*s,z);t.material=M.trunk;t.checkCollisions=true;const c=BABYLON.MeshBuilder.CreateSphere('crown',{diameter:5*s,segments:10},scene);c.position.set(x,6*s,z);c.material=M.leaf;c.checkCollisions=true;const c2=BABYLON.MeshBuilder.CreateSphere('crown2',{diameter:3.3*s,segments:10},scene);c2.position.set(x+1.1*s,6.2*s,z-.3*s);c2.material=M.leaf2;c2.checkCollisions=true}
function buildWorld(){const g=BABYLON.MeshBuilder.CreateGround('ground',{width:190,height:190,subdivisions:2},scene);g.material=M.ground;g.checkCollisions=true;box('roadA',0,.025,0,34,.05,190,M.road,false);box('roadB',0,.03,0,190,.05,34,M.road,false);for(const h of HOUSES){box('house',h.x,4,h.z,h.w,8,h.d,M.house);box('roof',h.x,8.5,h.z,h.w+1,1,h.d+1,M.roof,false);box('door',h.x,2.1,h.z-h.d/2-.08,3.1,4.2,.2,M.door,true);for(let i=-1;i<=1;i++)box('window',h.x+i*4.4,2.3,h.z-h.d/2-.1,2.4,1.3,.12,M.window,false)}for(const [x,z,s] of TREES)tree(x,z,s);const hemi=new BABYLON.HemisphericLight('hemi',new BABYLON.Vector3(0,1,0),scene);hemi.intensity=2.5;hemi.groundColor=new BABYLON.Color3(.35,.5,.3);const sun=new BABYLON.DirectionalLight('sun',new BABYLON.Vector3(-.5,-1,-.3),scene);sun.intensity=2.0;sun.position.set(30,60,20);for(let x=-75;x<=75;x+=25)for(let z=-75;z<=75;z+=25){const l=new BABYLON.PointLight('areaLight',new BABYLON.Vector3(x,12,z),scene);l.intensity=.55;l.range=28;l.diffuse=new BABYLON.Color3(1,.92,.75)}}
function makeLabel(text){const p=BABYLON.MeshBuilder.CreatePlane('name',{width:3.2,height:.55},scene);const tex=new BABYLON.DynamicTexture('txt'+Math.random(),{width:512,height:90},scene,true);tex.hasAlpha=true;const c=tex.getContext();c.clearRect(0,0,512,90);c.font='bold 42px Tahoma';c.textAlign='center';c.fillStyle='#fff';c.fillText(text,256,58);tex.update();const m=new BABYLON.StandardMaterial('lm'+Math.random(),scene);m.diffuseTexture=tex;m.opacityTexture=tex;m.emissiveColor=new BABYLON.Color3(1,1,1);m.backFaceCulling=false;p.material=m;p.billboardMode=BABYLON.Mesh.BILLBOARDMODE_ALL;return p}
function makeHuman(p,isBot=false){const root=new BABYLON.TransformNode((isBot?'bot_':'player_')+p.id,scene);const material=isBot?M.bot:(p.id===myId?M.player:M.other);const body=BABYLON.MeshBuilder.CreateBox('body',{width:1,height:1.5,depth:.6},scene);body.position.y=1.45;body.material=material;body.parent=root;const head=BABYLON.MeshBuilder.CreateSphere('head',{diameter:.75,segments:12},scene);head.position.y=2.45;head.material=M.skin;head.parent=root;const parts={legs:[],arms:[]};for(const s of [-1,1]){const leg=BABYLON.MeshBuilder.CreateBox('leg',{width:.3,height:1,depth:.35},scene);leg.position.set(s*.25,.5,0);leg.material=M.black;leg.parent=root;parts.legs.push(leg);const arm=BABYLON.MeshBuilder.CreateBox('arm',{width:.25,height:1,depth:.3},scene);arm.position.set(s*.67,1.45,.05);arm.material=material;arm.parent=root;parts.arms.push(arm)}const gunp=BABYLON.MeshBuilder.CreateBox('handgun',{width:.18,height:.18,depth:.75},scene);gunp.position.set(0,1.4,.55);gunp.material=M.gun;gunp.parent=root;const tag=makeLabel(isBot?p.name:p.name);tag.position.y=3.15;tag.parent=root;return {root,legs:parts.legs,arms:parts.arms,phase:Math.random()*6.28,lastX:0,lastZ:0}}
function makeCamera(){camera=new BABYLON.UniversalCamera('fps',new BABYLON.Vector3(0,2,0),scene);camera.minZ=.05;camera.maxZ=220;camera.fov=BABYLON.Tools.ToRadians(78);camera.checkCollisions=true;camera.applyGravity=true;camera.ellipsoid=new BABYLON.Vector3(.55,.9,.55);camera.ellipsoidOffset=new BABYLON.Vector3(0,-.78,0);camera.detachControl();scene.activeCamera=camera}
function makeGun(){gun=new BABYLON.TransformNode('gun',scene);gun.parent=camera;gun.position.set(.45,-.4,.9);const body=box('gbody',0,0,0,.48,.3,.9,M.gun,false);body.parent=gun;const barrel=BABYLON.MeshBuilder.CreateCylinder('gbarrel',{diameter:.11,height:1.6,tessellation:12},scene);barrel.rotation.x=Math.PI/2;barrel.position.z=.9;barrel.material=M.black;barrel.parent=gun}
buildWorld();makeCamera();makeGun();
function showToast(t,ms=1000){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),ms)}
function fmt(s){s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function startLocal(state){started=true;room=state;$('menu').classList.add('hidden');$('roomUI').classList.add('hidden');$('hud').classList.remove('hidden');playerName=state.players.find(p=>p.id===myId)?.name||playerName;$('playerName').textContent=playerName;camera.position.set(state.players.find(p=>p.id===myId)?.x||0,2,state.players.find(p=>p.id===myId)?.z||0);camera.rotation.set(0,state.players.find(p=>p.id===myId)?.rot||0,0);camera.attachControl(canvas,true);if(matchMedia('(pointer:coarse)').matches){camera.detachControl();setupMobile();}showToast('آماده‌ای — بزن بریم!',1200)}
function updateState(s){room=s;$('roomCode').textContent=s.code||'-----';$('count').textContent=s.players.length;$('timer').textContent=fmt(s.timeLeft);const me=s.players.find(p=>p.id===myId);if(me){$('hpText').textContent=Math.max(0,Math.ceil(me.hp));$('hpFill').style.width=Math.max(0,me.hp)+'%';$('kills').textContent=me.kills;if(started&&!me.dead&&performance.now()-lastMove>250){/* server remains authoritative; local camera stays smooth */}}for(const p of s.players){if(p.id===myId)continue;let m=remote.get(p.id);if(!m){m=makeHuman(p);remote.set(p.id,m)}m.root.position.set(p.x,0,p.z);m.root.rotation.y=p.rot||0;m.root.setEnabled(!p.dead);const moving=Math.hypot(p.x-m.lastX,p.z-m.lastZ)>.03;m.lastX=p.x;m.lastZ=p.z;if(moving){m.phase+=.35;m.legs[0].rotation.x=Math.sin(m.phase)*.5;m.legs[1].rotation.x=-Math.sin(m.phase)*.5;m.arms[0].rotation.x=-Math.sin(m.phase)*.25;m.arms[1].rotation.x=Math.sin(m.phase)*.25}}for(const b of s.bots){let m=bots.get(b.id);if(!m){m=makeHuman(b,true);bots.set(b.id,m)}m.root.position.set(b.x,0,b.z);m.root.rotation.y=b.rot||0;m.root.setEnabled(!b.dead);const moving=Math.hypot(b.x-m.lastX,b.z-m.lastZ)>.02;m.lastX=b.x;m.lastZ=b.z;if(moving){m.phase+=.42;m.legs[0].rotation.x=Math.sin(m.phase)*.6;m.legs[1].rotation.x=-Math.sin(m.phase)*.6;m.arms[0].rotation.x=-Math.sin(m.phase)*.35;m.arms[1].rotation.x=Math.sin(m.phase)*.35}}}
function move(){if(!started||!camera)return;let f=0,r=0;if(keys.KeyW||keys.ArrowUp)f++;if(keys.KeyS||keys.ArrowDown)f--;if(keys.KeyD||keys.ArrowRight)r++;if(keys.KeyA||keys.ArrowLeft)r--;f+=-joyY;r+=joyX;const len=Math.hypot(f,r);if(len>1){f/=len;r/=len}if(!f&&!r)return;const yaw=camera.rotation.y;const fx=Math.sin(yaw),fz=Math.cos(yaw),rx=fz,rz=-fx;const speed=(sprinting?12.5:8.2)*.05;camera.position.x+= (fx*f+rx*r)*speed;camera.position.z+=(fz*f+rz*r)*speed;camera.position.x=Math.max(-94,Math.min(94,camera.position.x));camera.position.z=Math.max(-94,Math.min(94,camera.position.z));const now=performance.now();if(now-lastMove>45){socket.emit('move',{x:camera.position.x,z:camera.position.z,rot:camera.rotation.y,sprint:sprinting});lastMove=now}}
setInterval(move,50);
function shoot(){if(!started||performance.now()-lastShot<140)return;lastShot=performance.now();const ray=camera.getForwardRay(120);const hit=scene.pickWithRay(ray,m=>m&&m.isPickable&&!m.metadata?.nameLabel);const end=hit&&hit.hit&&hit.pickedPoint?hit.pickedPoint:ray.origin.add(ray.direction.scale(120));const line=BABYLON.MeshBuilder.CreateLines('laser',{points:[ray.origin,end]},scene);line.color=new BABYLON.Color3(1,.03,.02);setTimeout(()=>line.dispose(),100);$('muzzle').style.opacity='1';setTimeout(()=>$('muzzle').style.opacity='0',70);socket.emit('shoot',{dx:ray.direction.x,dz:ray.direction.z})}
function fullscreen(){const el=document.documentElement;if(document.fullscreenElement)return document.exitFullscreen?.();(el.requestFullscreen||el.webkitRequestFullscreen)?.call(el).catch?.(()=>{});try{screen.orientation?.lock?.('landscape')}catch(e){}}
$('create').onclick=()=>{const n=$('name').value.trim();if(!n)return $('msg').textContent='اول اسمت را وارد کن.';socket.emit('createRoom',{name:n})};$('showJoin').onclick=()=>$('joinArea').classList.toggle('hidden');$('join').onclick=()=>{const n=$('name').value.trim(),c=$('roomCodeInput').value.trim().toUpperCase();if(!n)return $('msg').textContent='اول اسمت را وارد کن.';if(!/^[A-Z0-9]{5}$/.test(c))return $('msg').textContent='کد باید دقیقاً ۵ حرف یا عدد باشد.';socket.emit('joinRoom',{name:n,roomCode:c})};$('start').onclick=()=>socket.emit('startGame');$('leave').onclick=()=>socket.emit('leaveRoom');$('desktopFull').onclick=fullscreen;$('full').onclick=fullscreen;
socket.on('connect',()=>myId=socket.id);socket.on('joined',d=>{room={code:d.code,hostId:myId,started:false,players:[],bots:[],timeLeft:600};$('menu').classList.add('hidden');$('roomUI').classList.remove('hidden');$('roomCode').textContent=d.code});socket.on('errorMessage',m=>{$('msg').textContent=m;$('roomMsg').textContent=m;showToast(m,1600)});socket.on('roomState',s=>{room=s;$('roomCode').textContent=s.code;$('start').classList.toggle('hidden',s.hostId!==myId||s.started);$('members').innerHTML=s.players.map(p=>`<div class="member ${p.id===s.hostId?'host':''}">${p.name}<b>${p.id===s.hostId?'👑':''}</b></div>`).join('');if(!started){}else updateState(s)});socket.on('gameStarted',s=>{updateState(s);startLocal(s)});socket.on('state',updateState);socket.on('shotFx',fx=>{const a=new BABYLON.Vector3(fx.origin.x,fx.origin.y,fx.origin.z),b=new BABYLON.Vector3(fx.end.x,fx.end.y,fx.end.z);const l=BABYLON.MeshBuilder.CreateLines('remoteLaser',{points:[a,b]},scene);l.color=new BABYLON.Color3(1,.03,.02);setTimeout(()=>l.dispose(),100)});socket.on('hit',d=>{if(d.targetId===myId){$('hpText').textContent=Math.ceil(d.hp);$('hpFill').style.width=d.hp+'%'}});socket.on('youDied',()=>{$('dead').classList.add('show');setTimeout(()=>$('dead').classList.remove('show'),1500)});socket.on('killEvent',d=>{if(d.killerId===myId)showToast('+1 کشتار',650)});socket.on('botKilled',d=>{if(d.killerId===myId)showToast('+1 کشتار · زامبی',650)});socket.on('gameOver',d=>{started=false;$('hud').classList.add('hidden');$('winner').classList.add('show');$('winnerText').textContent=d.winner?`🏆 برنده: ${d.winner.name} — ${d.winner.kills} کشتار`:'بازی تمام شد';setTimeout(()=>{$('winner').classList.remove('show');$('roomUI').classList.remove('hidden')},5500);camera.detachControl()});

function setupMobile(){if(!matchMedia('(pointer:coarse)').matches)return;const j=$('joy'),k=$('knob'),l=$('look');const stop=()=>{joyId=null;joyX=joyY=0;k.style.transform='translate(-50%,-50%)'};j.addEventListener('pointerdown',e=>{joyId=e.pointerId;j.setPointerCapture?.(e.pointerId);updJoy(e);e.preventDefault()},{passive:false});j.addEventListener('pointermove',e=>{if(e.pointerId===joyId){updJoy(e);e.preventDefault()}},{passive:false});j.addEventListener('pointerup',stop);j.addEventListener('pointercancel',stop);function updJoy(e){const r=j.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),max=r.width*.32,d=Math.hypot(dx,dy)||1,s=Math.min(1,d/max),x=dx/d*s,y=dy/d*s;joyX=x;joyY=-y;k.style.transform=`translate(calc(-50% + ${x*max}px),calc(-50% + ${y*max}px))`};l.addEventListener('pointerdown',e=>{lookId=e.pointerId;l.setPointerCapture?.(e.pointerId);lookX=e.clientX;lookY=e.clientY;e.preventDefault()},{passive:false});let lookX=0,lookY=0;l.addEventListener('pointermove',e=>{if(e.pointerId!==lookId||!started)return;const dx=e.clientX-lookX,dy=e.clientY-lookY;lookX=e.clientX;lookY=e.clientY;camera.rotation.y+=dx/700;camera.rotation.x=Math.max(-1.35,Math.min(1.35,camera.rotation.x+dy/700));e.preventDefault()},{passive:false});const endLook=()=>lookId=null;l.addEventListener('pointerup',endLook);l.addEventListener('pointercancel',endLook);$('fire').addEventListener('pointerdown',e=>{shoot();e.preventDefault()},{passive:false});$('run').addEventListener('pointerdown',()=>sprinting=true);$('run').addEventListener('pointerup',()=>sprinting=false);$('run').addEventListener('pointercancel',()=>sprinting=false)}
