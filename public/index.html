stify-content:center;background:#071a2be0;color:white;border:1px solid #ffffff2b;width:74px;height:48px;border-radius:15px}.fire{right:22px;bottom:25px;width:92px;height:92px;border-radius:50%;background:#b72c42dd;font-size:18px}.reload{right:125px;bottom:110px}.run{left:185px;bottom:35px}.full{right:18px;top:18px;width:48px;height:42px}.look{position:absolute;right:0;top:0;width:58%;height:100%;pointer-events:auto}.portrait{position:fixed;inset:0;z-index:100;background:#06101cf7;display:none;align-items:center;justify-content:center;text-align:center;padding:30px}.portrait .card{width:min(480px,90vw)}.result{position:fixed;inset:0;z-index:50;background:#02070dcc;display:none;align-items:center;justify-content:center}.result .card{text-align:center}.winner{font-size:34px;color:var(--gold);font-weight:1000;margin:12px 0}.rank{display:grid;gap:5px;text-align:right;max-height:220px;overflow:auto}.rank div{padding:9px 11px;background:#fff1;border-radius:10px}

<div id="ui">
  <section id="menu" class="screen"><div class="card"><h1 class="title">battle701</h1><p class="sub">بتل رویال بر و بچ 701(انلاین)</p><div class="field"><label>نام بازیکن</label><input id="name" maxlength="18" placeholder="اسمتو برای دختر نیمار بتایپ"></div><div class="grid"><button id="create">ساخت اتاق برای بازی</button><button id="showJoin" class="secondary">ورود به اتاق دیگران برای بازی</button></div><div id="joinBox" class="hidden"><div class="field"><label>کد اتاق</label><input id="code" maxlength="5" placeholder="ABCDE" style="text-transform:uppercase;text-align:center;letter-spacing:.25em"></div><button id="join" class="wide">یا الله</button></div><p id="menuHint" class="hint"></p></div></section>

<script>
(()=>{
'use strict';
const socket=io();
const canvas=document.getElementById('gameCanvas');
const engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:false,stencil:true,antialias:true});
const scene=new BABYLON.Scene(engine);scene.collisionsEnabled=true;scene.clearColor=new BABYLON.Color4(.08,.15,.21,1);
const ui={menu:by('menu'),lobby:by('lobby'),hud:by('hud'),result:by('result'),portrait:by('portrait'),name:by('name'),code:by('code'),joinBox:by('joinBox'),menuHint:by('menuHint'),lobbyHint:by('lobbyHint'),roomCode:by('roomCode'),players:by('players'),start:by('start'),hp:by('hp'),hpfill:by('hpfill'),kills:by('kills'),count:by('count'),timer:by('timer'),toast:by('toast'),winner:by('winner'),rank:by('rank'),mobile:by('mobile'),joy:by('joy'),knob:by('knob'),look:by('look'),fire:by('fire'),run:by('run'),reload:by('reload'),full:by('full')};
function by(id){return document.getElementById(id)}
let myId=null,room=null,started=false,gameEnd=0,localHP=100,localKills=0,lastState=0,fireAt=0,toastTimer=0;
let camera,gun,flash,flashLight;
const remote=new Map(),bots=new Map();
const keys={};const mobile={x:0,y:0,sprint:false,lookId:null,lastX:0,lastY:0,joyId:null};
const mats={};
function mat(n,c,e){const m=new BABYLON.StandardMaterial(n,scene);m.diffuseColor=new BABYLON.Color3(...c);m.specularColor=new BABYLON.Color3(.08,.08,.08);if(e)m.emissiveColor=new BABYLON.Color3(...e);return m}
mats.floor=mat('floor',[.18,.22,.19], [.035,.04,.03]);mats.wall=mat('wall',[.55,.50,.31],[.08,.07,.04]);mats.outer=mat('outer',[.28,.34,.35],[.04,.05,.05]);mats.tree=mat('tree',[.08,.36,.12]);mats.trunk=mat('trunk',[.25,.12,.05]);mats.player=mat('player',[.12,.48,.78],[.02,.08,.13]);mats.other=mat('other',[.68,.18,.62],[.05,.01,.05]);mats.bot=mat('bot',[.55,.12,.12],[.08,.01,.01]);mats.skin=mat('skin',[.88,.55,.38]);mats.gun=mat('gun',[.12,.14,.17],[.025,.03,.04]);
function box(n,w,h,d,x,y,z,m,coll=true){const q=BABYLON.MeshBuilder.CreateBox(n,{width:w,height:h,depth:d},scene);q.position.set(x,y,z);q.material=m;q.checkCollisions=coll;q.isPickable=coll;return q}
function buildWorld(){const floor=BABYLON.MeshBuilder.CreateGround('floor',{width:176,height:136,subdivisions:2},scene);floor.material=mats.floor;floor.checkCollisions=true;floor.isPickable=true;const B=[[0,-68,176,14,.8],[0,68,176,14,.8],[-88,0,.8,14,136],[88,0,.8,14,136],[-48,-35,45,12,.8],[48,-35,45,12,.8],[-48,-10,45,12,.8],[48,-10,45,12,.8],[-48,35,45,12,.8],[48,35,45,12,.8],[-48,10,45,12,.8],[48,10,45,12,.8],[-25,-22,.8,12,26],[25,-22,.8,12,26],[-25,22,.8,12,26],[25,22,.8,12,26],[-52,0,.8,12,20],[52,0,.8,12,20],[-18,0,30,12,.8],[18,0,30,12,.8],[-62,-22,.8,12,16],[-38,-22,.8,12,16],[38,-22,.8,12,16],[62,-22,.8,12,16],[-62,22,.8,12,16],[-38,22,.8,12,16],[38,22,.8,12,16],[62,22,.8,12,16],[-47,-47,28,12,.8],[47,-47,28,12,.8],[-47,47,28,12,.8],[47,47,28,12,.8],[-64,-45,.8,12,20],[-52,-45,.8,12,20],[-28,-45,.8,12,20],[-16,-45,.8,12,20],[16,-45,.8,12,20],[28,-45,.8,12,20],[52,-45,.8,12,20],[64,-45,.8,12,20],[-64,45,.8,12,20],[-52,45,.8,12,20],[-28,45,.8,12,20],[-16,45,.8,12,20],[16,45,.8,12,20],[28,45,.8,12,20],[52,45,.8,12,20],[64,45,.8,12,20],[-50,-30,18,12,.8],[-30,-30,14,12,.8],[-5,-30,18,12,.8],[20,-30,14,12,.8],[45,-30,18,12,.8],[-50,30,18,12,.8],[-30,30,14,12,.8],[-5,30,18,12,.8],[20,30,14,12,.8],[45,30,18,12,.8]];B.forEach((v,i)=>box('wall'+i,v[2],v[3],v[4],v[0],6,v[1],mats.wall,true));const trees=[[-76,-55,1.1],[-58,-54,.9],[-36,-55,1.15],[-14,-54,.85],[12,-55,1],[35,-53,1.15],[58,-54,.9],[77,-55,1.1],[-78,53,.9],[-57,55,1.1],[-35,53,.85],[-12,54,1.15],[13,54,.9],[35,53,1.15],[58,55,.85],[77,53,1],[-80,-10,1],[-72,8,.8],[72,-8,1],[80,12,.9],[-5,-61,.8],[5,61,.8]];trees.forEach(([x,z,s],i)=>{const t=BABYLON.MeshBuilder.CreateCylinder('trunk'+i,{diameter:1.1*s,height:4*s,tessellation:12},scene);t.position.set(x,2*s,z);t.material=mats.trunk;t.checkCollisions=true;const c=BABYLON.MeshBuilder.CreateSphere('tree'+i,{diameter:5.2*s,segments:10},scene);c.position.set(x,5*s,z);c.material=mats.tree;c.checkCollisions=true});for(let x=-72;x<=72;x+=24)for(let z=-52;z<=52;z+=34){const l=new BABYLON.PointLight('light'+x+'_'+z,new BABYLON.Vector3(x,8,z),scene);l.intensity=1.1;l.range=28;l.diffuse=new BABYLON.Color3(1,.9,.68)}const hemi=new BABYLON.HemisphericLight('hemi',new BABYLON.Vector3(0,1,0),scene);hemi.intensity=1.8;hemi.groundColor=new BABYLON.Color3(.2,.3,.2);const sun=new BABYLON.DirectionalLight('sun',new BABYLON.Vector3(-.4,-1,-.3),scene);sun.intensity=1.6}
buildWorld();
function createCamera(){camera=new BABYLON.UniversalCamera('camera',new BABYLON.Vector3(0,1.8,20),scene);camera.minZ=.05;camera.maxZ=150;camera.fov=BABYLON.Tools.ToRadians(78);camera.speed=.11;camera.inertia=.12;camera.checkCollisions=true;camera.applyGravity=true;camera.ellipsoid=new BABYLON.Vector3(.55,.9,.55);camera.ellipsoidOffset=new BABYLON.Vector3(0,-.78,0);camera.keysUp=[87];camera.keysDown=[83];camera.keysLeft=[65];camera.keysRight=[68];scene.activeCamera=camera}
function createGun(){gun=new BABYLON.TransformNode('gun',scene);gun.parent=camera;gun.position.set(.42,-.38,.95);box('gbody',.48,.34,.92,0,0,0,mats.gun,false).parent=gun;const barrel=BABYLON.MeshBuilder.CreateCylinder('barrel',{diameter:.12,height:1.8,tessellation:16},scene);barrel.rotation.x=Math.PI/2;barrel.position.set(0,.03,.95);barrel.material=mats.gun;barrel.parent=gun;flash=BABYLON.MeshBuilder.CreateSphere('flash',{diameter:.25,segments:8},scene);flash.position.set(0,.03,1.9);flash.material=mat('flash',[1,.6,.1],[1,.15,.01]);flash.parent=gun;flash.setEnabled(false);flashLight=new BABYLON.PointLight('flashLight',new BABYLON.Vector3(0,0,0),scene);flashLight.parent=gun;flashLight.position.set(0,.03,1.9);flashLight.intensity=0;flashLight.range=8}
createCamera();createGun();
function remoteModel(p,isMe=false){const root=new BABYLON.TransformNode('p_'+p.id,scene);const body=box('body',.9,1.35,.55,0,1.45,0,isMe?mats.player:mats.other,false);body.parent=root;const head=BABYLON.MeshBuilder.CreateSphere('head',{diameter:.75,segments:12},scene);head.position.set(0,2.35,0);head.material=mats.skin;head.parent=root;const tag=BABYLON.MeshBuilder.CreatePlane('tag',{width:2,height:.35},scene);tag.position.set(0,3.05,0);tag.billboardMode=BABYLON.Mesh.BILLBOARDMODE_Y;tag.parent=root;tag.material=labelMat(p.name,isMe?'#61d8ff':'#fff');tag.isPickable=false;return root}
function labelMat(text,color){const tex=new BABYLON.DynamicTexture('label'+Math.random(),{width:512,height:96},scene,true);tex.hasAlpha=true;const ctx=tex.getContext();ctx.clearRect(0,0,512,96);ctx.font='bold 40px Arial';ctx.textAlign='center';ctx.fillStyle=color;ctx.fillText(text,256,58);const m=new BABYLON.StandardMaterial('lm',scene);m.diffuseTexture=tex;m.emissiveColor=new BABYLON.Color3(1,1,1);m.opacityTexture=tex;m.backFaceCulling=false;return m}
function botModel(b){const root=new BABYLON.TransformNode('bot_'+b.id,scene);box('bbody',.95,1.3,.58,0,1.4,0,mats.bot,false).parent=root;const h=BABYLON.MeshBuilder.CreateSphere('bhead',{diameter:.8,segments:12},scene);h.position.set(0,2.35,0);h.material=mats.skin;h.parent=root;for(const sx of [-.6,.6])box('arm',.22,1,.3,sx,1.45,0,mats.bot,false).parent=root;const tag=BABYLON.MeshBuilder.CreatePlane('btag',{width:1.5,height:.3},scene);tag.position.set(0,3,0);tag.billboardMode=BABYLON.Mesh.BILLBOARDMODE_Y;tag.material=labelMat('ZOMBIE','#ff6874');tag.parent=root;return root}
function sync(s){lastState=performance.now();room=s;ui.roomCode.textContent=s.code||'-----';ui.count.textContent=s.players.length;for(const p of s.players){if(p.id===myId){localHP=p.hp;localKills=p.kills;ui.hp.textContent=Math.ceil(p.hp);ui.hpfill.style.width=p.hp+'%';ui.kills.textContent=p.kills;continue}let m=remote.get(p.id);if(!m){m=remoteModel(p);remote.set(p.id,m)}m.position.set(p.x,0,p.z);m.setEnabled(!p.dead)}for(const [id,m] of remote){if(!s.players.some(p=>p.id===id)){m.dispose(false,true);remote.delete(id)}}for(const b of s.bots){let m=bots.get(b.id);if(!m){m=botModel(b);bots.set(b.id,m)}m.position.set(b.x,0,b.z);m.setEnabled(!b.dead)}for(const [id,m] of bots){if(!s.bots.some(b=>b.id===id)){m.dispose(false,true);bots.delete(id)}}}
function fmt(sec){sec=Math.max(0,Math.floor(sec));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function toast(t,ms=900){ui.toast.textContent=t;ui.toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>ui.toast.classList.remove('show'),ms)}
function showLobby(){ui.menu.classList.add('hidden');ui.result.classList.add('hidden');ui.lobby.classList.remove('hidden');ui.hud.classList.add('hidden');ui.start.disabled=!room||room.hostId!==myId||room.started;ui.lobbyHint.textContent=room&&room.hostId===myId?'شما میزبان هستید.':'منتظر میزبان بمان.';ui.players.innerHTML=(room?.players||[]).map(p=>`<div class="player"><span>${escapeHtml(p.name)}</span><b class="${p.id===room.hostId?'host':''}">${p.id===room.hostId?'👑 میزبان':''}</b></div>`).join('')}
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function startLocal(){started=true;ui.menu.classList.add('hidden');ui.lobby.classList.add('hidden');ui.hud.classList.remove('hidden');gameEnd=room.startedAt+600000;camera.position.set(0,2,20);camera.cameraDirection.set(0,0,0);camera.rotation.set(0,Math.PI,0);canvas.focus();if(!isCoarse()){try{canvas.requestPointerLock?.()}catch(e){}}toast('آماده‌ای — بزن بریم!',1200)}
function isCoarse(){return matchMedia('(pointer:coarse)').matches||'ontouchstart'in window}
function shoot(){if(!started||localHP<=0||performance.now()<fireAt)return;fireAt=performance.now()+140;flash?.setEnabled(true);if(flashLight)flashLight.intensity=8;setTimeout(()=>{flash?.setEnabled(false);if(flashLight)flashLight.intensity=0},85);const ray=camera.getForwardRay(110);socket.emit('player:shoot',{dx:ray.direction.x,dz:ray.direction.z});playTone(120,.06)}
function playTone(f,d){try{const A=window.AudioContext||window.webkitAudioContext;if(!window._a)window._a=new A();const a=window._a,o=a.createOscillator(),g=a.createGain();o.type='square';o.frequency.value=f;g.gain.value=.02;g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d+.01)}catch(e){}}
function movement(){if(!started)return;let x=0,z=0;if(keys.w||keys.W||keys.ArrowUp)z+=1;if(keys.s||keys.S||keys.ArrowDown)z-=1;if(keys.a||keys.A||keys.ArrowLeft)x-=1;if(keys.d||keys.D||keys.ArrowRight)x+=1;if(isCoarse()){x=mobile.x;z=mobile.y}const len=Math.hypot(x,z);if(len>1){x/=len;z/=len}const sy=mobile.sprint||keys.Shift;const f={x:Math.sin(camera.rotation.y),z:Math.cos(camera.rotation.y)},r={x:f.z,z:-f.x};socket.emit('player:input',{x:f.x*z+r.x*x,z:f.z*z+r.z*x,sprint:sy,aimX:f.x,aimZ:f.z})}
setInterval(movement,50);
window.addEventListener('keydown',e=>{keys[e.key]=true;keys[e.code]=true;if(e.code==='KeyR')socket.emit('player:reload');if(e.code==='Space')e.preventDefault()});window.addEventListener('keyup',e=>{keys[e.key]=false;keys[e.code]=false});canvas.addEventListener('mousedown',e=>{if(e.button===0){if(document.pointerLockElement!==canvas)try{canvas.requestPointerLock?.()}catch(_){}shoot()}});canvas.addEventListener('contextmenu',e=>e.preventDefault());
ui.create.onclick=()=>socket.emit('createRoom',{name:ui.name.value.trim()||'Player'});
ui.showJoin.onclick=()=>ui.joinBox.classList.toggle('hidden');
ui.join.onclick=()=>socket.emit('joinRoom',{name:ui.name.value.trim()||'Player',code:ui.code.value.trim().toUpperCase()});
ui.start.onclick=()=>socket.emit('startGame');
ui.backMenu.onclick=()=>location.reload();
ui.fire.addEventListener('pointerdown',e=>{e.preventDefault();shoot()});ui.run.addEventListener('pointerdown',()=>mobile.sprint=true);ui.run.addEventListener('pointerup',()=>mobile.sprint=false);ui.run.addEventListener('pointercancel',()=>mobile.sprint=false);ui.full.addEventListener('pointerdown',()=>document.documentElement.requestFullscreen?.().catch(()=>{}));
ui.joy.addEventListener('pointerdown',e=>{mobile.joyId=e.pointerId;ui.joy.setPointerCapture?.(e.pointerId);updateJoy(e)});ui.joy.addEventListener('pointermove',e=>{if(e.pointerId===mobile.joyId)updateJoy(e)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>ui.joy.addEventListener(ev,()=>{mobile.joyId=null;mobile.x=mobile.y=0;ui.knob.style.transform='translate(-50%,-50%)'}));function updateJoy(e){const r=ui.joy.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,max=r.width*.31,l=Math.hypot(dx,dy)||1,s=Math.min(1,l/max),x=dx/l*s,y=dy/l*s;mobile.x=x;mobile.y=-y;ui.knob.style.transform=`translate(calc(-50% + ${x*max}px),calc(-50% + ${y*max}px))`}
ui.look.addEventListener('pointerdown',e=>{mobile.lookId=e.pointerId;mobile.lastX=e.clientX;mobile.lastY=e.clientY;ui.look.setPointerCapture?.(e.pointerId)});ui.look.addEventListener('pointermove',e=>{if(e.pointerId!==mobile.lookId||!started)return;const dx=e.clientX-mobile.lastX,dy=e.clientY-mobile.lastY;mobile.lastX=e.clientX;mobile.lastY=e.clientY;camera.rotation.y+=dx/700;camera.rotation.x=Math.max(-1.35,Math.min(1.35,camera.rotation.x+dy/700))});['pointerup','pointercancel'].forEach(ev=>ui.look.addEventListener(ev,()=>mobile.lookId=null));
socket.on('connect',()=>{myId=socket.id});socket.on('room:created',r=>{room=r;showLobby()});socket.on('room:joined',r=>{room=r;showLobby()});socket.on('room:update',r=>{room=r;if(!started)showLobby();});socket.on('room:error',m=>{ui.menuHint.textContent=m;ui.lobbyHint.textContent=m;toast(m,1600)});socket.on('game:start',s=>{sync(s);startLocal()});socket.on('state',s=>{if(started)sync(s);});socket.on('shot:fx',fx=>tracer(fx.origin,fx.end,fx.shooterId===myId));socket.on('bot:shot',fx=>tracer(fx.origin,fx.end,false));socket.on('player:damage',d=>{if(d.id===myId){localHP=d.hp;ui.hp.textContent=Math.ceil(d.hp);ui.hpfill.style.width=d.hp+'%';navigator.vibrate?.(15)}});socket.on('player:heal',d=>{if(d.id===myId){localHP=d.hp;ui.hp.textContent=Math.ceil(d.hp);ui.hpfill.style.width=d.hp+'%';toast('+5 HP',500)}});socket.on('player:killed',d=>{if(d.victimId===myId){toast('کشته شدی — Respawn...',1300)}if(d.killerId===myId)toast('+1 KILL',700)});socket.on('bot:killed',d=>{if(d.killerId===myId)toast('+1 KILL · ZOMBIE',700)});socket.on('game:over',d=>{started=false;ui.hud.classList.add('hidden');ui.result.classList.remove('hidden');ui.winner.textContent=d.winner?`🏆 برنده: ${d.winner.name} — ${d.winner.kills} KILL`:'برنده‌ای وجود ندارد';ui.rank.innerHTML=d.players.map((p,i)=>`<div>${i+1}. ${escapeHtml(p.name)} — ${p.kills} KILL</div>`).join('')});
function tracer(a,b,own){const s=new BABYLON.Vector3(a.x,a.y,a.z),e=new BABYLON.Vector3(b.x,b.y,b.z);const line=BABYLON.MeshBuilder.CreateLines('tracer',{points:[s,e]},scene);line.color=new BABYLON.Color3(1,.04,.02);line.isPickable=false;setTimeout(()=>line.dispose(),100)}
engine.runRenderLoop(()=>{try{scene.render();if(started){const left=Math.max(0,gameEnd-Date.now());ui.timer.textContent=fmt(left/1000);if(left<=0)started=false}}catch(e){console.error(e)}});window.addEventListener('resize',()=>engine.resize());
})();
</script>
</body>
